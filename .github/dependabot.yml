version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Vitest exige una versión concreta de Vite: se actualizan juntos.
      pruebas:
        patterns: ['vitest', '@vitest/*', 'vite', '@vitejs/*']
      # React y sus tipos deben moverse a la vez.
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      # Solo minor y patch van agrupados; las versiones mayores llegan en PR propio.
      minor-y-patch:
        update-types: ['minor', 'patch']
    ignore:
      # Se mantiene en la 6 como el backend, hasta confirmar que Next y las herramientas la soportan.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Debe seguir la versión de Node del proyecto (.nvmrc).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope

  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    # Subir de versión mayor de Node se decide a mano, junto con .nvmrc y engines.
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
